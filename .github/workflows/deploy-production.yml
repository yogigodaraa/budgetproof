name: Deploy to production

# Gated production deploy. On merge to prod this runs, targeting the "production"
# GitHub Environment. Once that environment has Required reviewers configured
# (Settings → Environments → production), the run PAUSES on "Review deployments →
# Approve" before it deploys — that click is the "ship to production" gate.
#
# Safe before setup: if the Vercel secrets aren't present, the deploy steps are
# skipped (no failures). Enable by adding VERCEL_* secrets and disabling Vercel's
# own automatic production deploy.

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://budgetproof.yogigodara.com
    steps:
      - name: Check deploy is configured
        id: check
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "VERCEL_TOKEN not set — skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
      - name: Setup Node
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Vercel (production)
        if: steps.check.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
