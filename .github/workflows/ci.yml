name: CI

on:
  pull_request:
  push:
    branches: [prod]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lint fails only on ERRORS (warnings allowed); a real new error blocks merge.
      - run: npx eslint .
      # Production build must compile (catches broken imports / type errors).
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
